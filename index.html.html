<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SST Obra – Circuito Vial Chupaca</title>
<style>
:root{--bg:#f2f5f9;--pn:#fff;--tx:#17263a;--mu:#5d6b7d;--br:#d3dbe6;--ac:#d9b06a;--dk:#0b4f94;--cy:#1ea7e6;--ok:#2e8b57;--md:#f5d000;--al:#d32f2f}
@media(prefers-color-scheme:dark){:root{--bg:#101820;--pn:#18232f;--tx:#e6edf5;--mu:#97a6b8;--br:#2c3b4c;--dk:#08335f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--dk);color:#fff;padding:10px 14px;border-bottom:5px solid var(--ac);display:flex;align-items:center;gap:14px}
header img{height:46px;background:#fff;border-radius:6px;padding:3px 6px;flex:none}
header b{font-size:16px;display:block}header small{opacity:.8}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--dk);padding:0 8px}
nav button{background:none;border:0;color:#cfd8d2;padding:10px 12px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:var(--cy);font-weight:600}
main{max-width:1100px;margin:auto;padding:14px}
.pn{background:var(--pn);border:1px solid var(--br);border-radius:6px;padding:12px;margin-bottom:14px;overflow-x:auto}
h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}
label{display:block;font-size:12px;color:var(--mu)}
input,select,textarea{width:100%;padding:7px;border:1px solid var(--br);border-radius:4px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox],input[type=radio]{width:auto}
button.b{background:var(--dk);color:#fff;border:0;padding:8px 14px;border-radius:4px;cursor:pointer;font:inherit}
button.b.a{background:var(--ac);color:#0b2440;font-weight:600}button.s{background:none;border:1px solid var(--br);color:var(--tx);border-radius:4px;padding:3px 8px;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--br);padding:6px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--mu)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;background:var(--mu)}
.R0{background:var(--ok)}.R1{background:var(--md);color:#111}.R2{background:var(--al)}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 10px}.chk label{color:var(--tx);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.em{color:var(--mu);padding:10px}
.warn{color:var(--al);font-weight:600}
@media print{nav,.np{display:none!important}header{background:#fff;color:#000;border-bottom:3px solid #0b4f94}header img{padding:0}body{background:#fff;color:#000}.pn{border:0}}

<nav id="nav"></nav><main id="m"></main>
<script>
const $=q=>document.querySelector(q),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
loc=d=>new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10),hoy=()=>loc(new Date());
let db=Object.assign({pers:[],falt:[],items:[],mov:[],ats:[],chk:[]},JSON.parse(localStorage.getItem('sst')||'{}'));
const save=()=>localStorage.setItem('sst',JSON.stringify(db));
const EPP={"Cabeza":["Casco de seguridad c/Barbiquejo","Casco de seguridad"],"Facial":["Lentes c/impacto luna clara","Lentes c/impacto luna oscura","Careta facial luna clara","Máscara p/soldadura eléctrica"],"Respiratoria":["Respirador c/polvo","Mascarilla 3 pliegues"],"Auditiva":["Tapón auditivo","Orejeras y/o tapones auditivos"],"Pies":["Zapatos de seguridad c/punta reforzada","Escarpines de cuero cromo"],"Manos":["Guantes de cuero","Guantes de hilo con palma de látex","Guantes P/Mecánico Dyneema","Guantes de nitrilo descartables","Guantes de nitrilo/neoprene (P/químicos)","Guantes de cuero cromo (Soldador)","Guantes dieléctricos","Guantes de cuero c/palma reforzada"],"Tronco":["Casaca de cuero cromo","Mandil de cuero cromo","Traje Tyvek","Mameluco/Uniforme de protección"],"Diversa":["Arnés de seguridad c/Línea de Anclaje","Chaleco/Polo y pantalón con cinta reflectiva","Cortaviento","Bloqueador Solar"]};
const EPPL=Object.values(EPP).flat();
const HERR=["Volquete","Tractor oruga","Excavadora","Equipo anticaídas","Cargador Frontal","Retroexcavadora","Andamios","Motoniveladora","Minibam"];
const CHK=["Luz y alarma de retroceso operativas","Frenos y dirección en buen estado","Luces, bocina y espejos","Neumáticos / orugas en buen estado","Niveles de aceite, refrigerante y combustible","Sin fugas hidráulicas ni de combustible","Cinturón de seguridad / cabina (ROPS)","Extintor vigente y botiquín","Extintor, triángulos y conos","Documentos: SOAT, revisión técnica, licencia del operador","Zona de trabajo señalizada","Línea de anclaje / arnés (si aplica)"];
const nivel=v=>v>=12?2:v>=4?1:0,NV=['BAJO','MEDIO','ALTO'];
const tabs={pers:'Personal',falt:'EPP faltante',kar:'Kardex',ats:'ATS',chk:'Check list maquinaria',rep:'Reportes',resp:'Respaldo'};
let tab='pers',view=null;
const opts=(a,sel)=>a.map(x=>`<option ${x==sel?'selected':''}>${esc(x)}</option>`).join('');
const pOpts=sel=>db.pers.map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.nom)}</option>`).join('');
const pn=id=>(db.pers.find(p=>p.id==id)||{}).nom||'—';
const fd=f=>new FormData(f);
function go(t){tab=t;view=null;draw()}
function draw(){
 $('#nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
 $('#m').innerHTML=({pers:vPers,falt:vFalt,kar:vKar,ats:vAts,chk:vChk,rep:vRep,resp:vResp})[tab]();
}
function del(k,id){if(confirm('¿Eliminar registro?')){db[k]=db[k].filter(x=>x.id!=id);save();draw()}}
/* PERSONAL */
function vPers(){return `<div class="pn"><h2>Registro de personal</h2><form class="g" onsubmit="addP(event)">
<div><label>Nombres y apellidos</label><input name="nom" required></div><div><label>DNI</label><input name="dni" inputmode="numeric" maxlength="8"></div>
<div><label>Cargo</label><input name="cargo"></div><div><label>Cuadrilla / frente</label><input name="cuad"></div><button class="b a">Agregar</button></form></div>
<div class="pn"><table><tr><th>Nombre</th><th>DNI</th><th>Cargo</th><th>Cuadrilla</th><th></th></tr>${db.pers.map(p=>`<tr><td>${esc(p.nom)}</td><td>${esc(p.dni)}</td><td>${esc(p.cargo)}</td><td>${esc(p.cuad)}</td><td><button class="s" onclick="del('pers','${p.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td class="em" colspan=5>Aún no hay personal registrado.</td></tr>'}</table></div>`}
function addP(e){e.preventDefault();db.pers.push({id:uid(),...Object.fromEntries(fd(e.target))});save();draw()}
/* EPP FALTANTE */
function vFalt(){return `<div class="pn"><h2>Materiales / EPP que le falta a cada integrante</h2>${db.pers.length?`<form class="g" onsubmit="addF(event)">
<div><label>Integrante</label><select name="p">${pOpts()}</select></div><div><label>EPP o material</label><select name="m">${opts(EPPL)}</select></div>
<div><label>Cantidad / talla</label><input name="c" value="1"></div><button class="b a">Registrar faltante</button></form>`:'<p class="em">Primero registra personal.</p>'}</div>
<div class="pn"><table><tr><th>Integrante</th><th>Material</th><th>Cant./talla</th><th>Fecha</th><th>Estado</th><th></th></tr>${db.falt.map(f=>`<tr><td>${esc(pn(f.p))}</td><td>${esc(f.m)}</td><td>${esc(f.c)}</td><td>${f.f}</td><td><span class="tag ${f.ok?'R0':'R2'}">${f.ok?'Entregado':'Pendiente'}</span></td><td><button class="s" onclick="tgF('${f.id}')">${f.ok?'Reabrir':'Marcar entregado'}</button> <button class="s" onclick="del('falt','${f.id}')">✕</button></td></tr>`).join('')||'<tr><td class="em" colspan=6>Sin faltantes registrados.</td></tr>'}</table></div>`}
function addF(e){e.preventDefault();const d=Object.fromEntries(fd(e.target));db.falt.push({id:uid(),...d,f:hoy(),ok:false});save();draw()}
function tgF(id){const f=db.falt.find(x=>x.id==id);f.ok=!f.ok;save();draw()}
/* KARDEX */
const stock=id=>db.mov.filter(m=>m.i==id).reduce((s,m)=>s+(m.t=='Entrada'?1:-1)*m.q,0);
function vKar(){return `<div class="pn"><h2>Kardex de insumos</h2><h3>Nuevo insumo</h3><form class="g" onsubmit="addI(event)">
<div><label>Insumo</label><input name="n" required></div><div><label>Unidad</label><input name="u" value="und"></div><div><label>Stock mínimo</label><input name="min" type="number" value="0"></div><button class="b">Crear insumo</button></form></div>
${db.items.length?`<div class="pn"><h3>Registrar movimiento</h3><form class="g" onsubmit="addM(event)">
<div><label>Insumo</label><select name="i">${db.items.map(i=>`<option value="${i.id}">${esc(i.n)}</option>`).join('')}</select></div>
<div><label>Tipo</label><select name="t"><option>Salida</option><option>Entrada</option></select></div><div><label>Cantidad</label><input name="q" type="number" min="0.01" step="any" required></div>
<div><label>Fecha</label><input name="f" type="date" value="${hoy()}"></div><div><label>Entregado a / proveedor</label><select name="p"><option value="">—</option>${pOpts()}</select></div><div><label>Nota</label><input name="nt"></div><button class="b a">Guardar</button></form></div>`:''}
<div class="pn"><h3>Stock actual</h3><table><tr><th>Insumo</th><th>Unidad</th><th>Stock</th><th>Mínimo</th><th></th></tr>${db.items.map(i=>{const s=stock(i.id);return `<tr><td>${esc(i.n)}</td><td>${esc(i.u)}</td><td><b class="${s<=i.min?'warn':''}">${s}</b></td><td>${i.min}</td><td>${s<=i.min?'<span class="tag R2">Reponer</span> ':''}<button class="s" onclick="del('items','${i.id}')">✕</button></td></tr>`}).join('')||'<tr><td class="em" colspan=5>Crea tu primer insumo.</td></tr>'}</table></div>
<div class="pn"><h3>Movimientos</h3><table><tr><th>Fecha</th><th>Insumo</th><th>Tipo</th><th>Cant.</th><th>Persona</th><th>Nota</th><th></th></tr>${[...db.mov].reverse().slice(0,60).map(m=>`<tr><td>${m.f}</td><td>${esc((db.items.find(i=>i.id==m.i)||{}).n)}</td><td>${m.t}</td><td>${m.q}</td><td>${m.p?esc(pn(m.p)):''}</td><td>${esc(m.nt)}</td><td><button class="s" onclick="del('mov','${m.id}')">✕</button></td></tr>`).join('')||'<tr><td class="em" colspan=7>Sin movimientos.</td></tr>'}</table></div>`}
function addI(e){e.preventDefault();const d=Object.fromEntries(fd(e.target));db.items.push({id:uid(),n:d.n,u:d.u,min:+d.min});save();draw()}
function addM(e){e.preventDefault();const d=Object.fromEntries(fd(e.target));d.q=+d.q;if(d.t=='Salida'&&d.q>stock(d.i)&&!confirm('La salida supera el stock. ¿Continuar?'))return;db.mov.push({id:uid(),...d});save();draw()}
/* ATS */
function vAts(){if(view)return atsForm(view=='new'?{}:db.ats.find(a=>a.id==view));
return `<div class="pn"><h2>Análisis de Trabajo Seguro (ATS)</h2><button class="b a" onclick="view='new';draw()">Nuevo ATS</button></div>
<div class="pn"><table><tr><th>Fecha</th><th>Trabajo</th><th>Lugar</th><th>Supervisor</th><th>Riesgo máx.</th><th></th></tr>${[...db.ats].reverse().map(a=>{const mx=Math.max(0,...(a.t||[]).map(t=>t.s*t.p));return `<tr><td>${a.fecha}</td><td>${esc(a.trab)}</td><td>${esc(a.lugar)}</td><td>${esc(a.sup)}</td><td><span class="tag R${nivel(mx)}">${NV[nivel(mx)]} (${mx})</span></td><td><button class="s" onclick="view='${a.id}';draw()">Abrir / imprimir</button> <button class="s" onclick="del('ats','${a.id}')">✕</button></td></tr>`}).join('')||'<tr><td class="em" colspan=6>Aún no hay ATS.</td></tr>'}</table></div>`}
const sel4=(n,v,l)=>`<select class="${n}" onchange="rk(this)">${[1,2,3,4].map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
function taskRow(t={}){const r=(t.s||1)*(t.p||1);return `<tr class="tr"><td><textarea rows=2 class="ta">${esc(t.tarea)}</textarea></td><td><textarea rows=2 class="pe">${esc(t.pel)}</textarea></td><td><textarea rows=2 class="ri">${esc(t.ries)}</textarea></td><td>${sel4('s',t.s||1)}</td><td>${sel4('p',t.p||1)}</td><td class="rr"><span class="tag R${nivel(r)}">${r} ${NV[nivel(r)]}</span></td><td><textarea rows=2 class="co">${esc(t.ctrl)}</textarea></td><td><button class="s np" onclick="this.closest('tr').remove()">✕</button></td></tr>`}
function rk(el){const tr=el.closest('tr'),r=tr.querySelector('.s').value*tr.querySelector('.p').value;tr.querySelector('.rr').innerHTML=`<span class="tag R${nivel(r)}">${r} ${NV[nivel(r)]}</span>`}
function addTask(){$('#tb').insertAdjacentHTML('beforeend',taskRow())}
function atsForm(a){const ck=(n,l,arr)=>`<div class="chk">${l.map(x=>`<label><input type="checkbox" name="${n}" value="${esc(x)}" ${(arr||[]).includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}</div>`;
return `<form class="pn" id="af" onsubmit="saveAts(event,'${a.id||''}')"><h2>ATS · FTO-SST-CDC-25-02 v03</h2>
<div class="g"><div><label>1. Trabajo a realizar</label><input name="trab" value="${esc(a.trab)}" required></div><div><label>2. Fecha</label><input type="date" name="fecha" value="${a.fecha||hoy()}"></div><div><label>3. Hora</label><input type="time" name="hora" value="${a.hora||''}"></div>
<div><label>4. Lugar</label><input name="lugar" value="${esc(a.lugar)}"></div><div><label>5. Área/Sección</label><input name="area" value="${esc(a.area)}"></div><div><label>6. Turno</label><select name="turno">${opts(['Día','Noche'],a.turno)}</select></div>
<div><label>7. Supervisor a cargo</label><input name="sup" value="${esc(a.sup)}"></div></div>
<h3 style="margin-top:14px">8. EPP requerido</h3>${Object.entries(EPP).map(([g,l])=>`<b style="font-size:12px">${g}</b>${ck('epp',l,a.epp)}`).join('')}
<h3 style="margin-top:14px">9. Herramientas y equipos que requieren check list</h3>${ck('herr',HERR,a.herr)}
<div style="margin-top:8px"><label>10. Otras herramientas y equipos</label><input name="otras" value="${esc(a.otras)}"></div>
<h3 style="margin-top:14px">Identificación de riesgos y medidas de control</h3>
<table><tr><th>11. Tarea</th><th>12. Peligro</th><th>13. Riesgos</th><th>S (1-4)</th><th>P (1-4)</th><th>Riesgo PxS</th><th>15. Medidas de control</th><th></th></tr><tbody id="tb">${(a.t&&a.t.length?a.t:[{}]).map(taskRow).join('')}</tbody></table>
<div class="row np"><button type="button" class="s" onclick="addTask()">+ Agregar tarea</button></div>
<p style="font-size:12px;color:var(--mu)">Matriz: 1–3 Bajo · 4–9 Medio · 12–16 Alto. S: 4 catastrófico, 3 grave, 2 moderado, 1 leve. P: 4 muy probable, 3 probable, 2 poco probable, 1 improbable.</p>
<h3>Participantes (firma de entrada)</h3><div class="chk">${db.pers.map(p=>`<label><input type="checkbox" name="part" value="${esc(p.nom)}" ${(a.part||[]).includes(p.nom)?'checked':''}> ${esc(p.nom)}</label>`).join('')||'<span class="em">Registra personal para elegirlo aquí.</span>'}</div>
<div class="g" style="margin-top:10px"><div><label>Elaborado por (líder de cuadrilla)</label><input name="el" value="${esc(a.el)}"></div><div><label>Aprobado por (maestro de obra)</label><input name="ap" value="${esc(a.ap)}"></div><div><label>Autorizado: residente de obra</label><input name="re" value="${esc(a.re)}"></div><div><label>Autorizado: especialista de seguridad</label><input name="es" value="${esc(a.es)}"></div></div>
<div class="row np"><button class="b a">Guardar ATS</button><button type="button" class="b" onclick="window.print()">Imprimir / PDF</button><button type="button" class="s" onclick="view=null;draw()">Volver</button></div></form>`}
function saveAts(e,id){e.preventDefault();const f=fd(e.target),o={id:id||uid()};
['trab','fecha','hora','lugar','area','turno','sup','otras','el','ap','re','es'].forEach(k=>o[k]=f.get(k));
['epp','herr','part'].forEach(k=>o[k]=f.getAll(k));
o.t=[...document.querySelectorAll('.tr')].map(r=>({tarea:r.querySelector('.ta').value,pel:r.querySelector('.pe').value,ries:r.querySelector('.ri').value,s:+r.querySelector('.s').value,p:+r.querySelector('.p').value,ctrl:r.querySelector('.co').value})).filter(t=>t.tarea||t.pel);
db.ats=id?db.ats.map(x=>x.id==id?o:x):[...db.ats,o];save();view=null;draw()}
/* CHECKLIST */
function vChk(){if(view=='new')return `<form class="pn" onsubmit="saveChk(event)"><h2>Check list de maquinaria / equipo</h2><div class="g">
<div><label>Equipo</label><select name="eq">${opts(HERR)}</select></div><div><label>Placa / código</label><input name="pl" required></div><div><label>Operador</label><select name="op">${pOpts()}</select></div><div><label>Fecha</label><input type="date" name="f" value="${hoy()}"></div><div><label>Horómetro / km</label><input name="h"></div></div>
<table style="margin-top:10px"><tr><th>Punto a verificar</th><th>Cumple</th><th>No cumple</th><th>N/A</th></tr>${CHK.map((c,i)=>`<tr><td>${c}</td>${['C','N','A'].map((v,j)=>`<td><input type="radio" name="c${i}" value="${v}" ${j==0?'checked':''}></td>`).join('')}</tr>`).join('')}</table>
<div style="margin-top:8px"><label>Observaciones</label><textarea name="ob" rows=2></textarea></div><div class="row"><button class="b a">Guardar check list</button><button type="button" class="s" onclick="view=null;draw()">Cancelar</button></div></form>`;
return `<div class="pn"><h2>Check list de maquinaria</h2><button class="b a" onclick="view='new';draw()">Nuevo check list</button></div><div class="pn"><table><tr><th>Fecha</th><th>Equipo</th><th>Placa</th><th>Operador</th><th>Resultado</th><th></th></tr>${[...db.chk].reverse().map(c=>{const bad=c.r.filter(x=>x=='N').length;return `<tr><td>${c.f}</td><td>${esc(c.eq)}</td><td>${esc(c.pl)}</td><td>${esc(pn(c.op))}</td><td><span class="tag ${bad?'R2':'R0'}">${bad?bad+' no cumple · NO operar':'Apto'}</span> ${esc(c.ob)}</td><td><button class="s" onclick="del('chk','${c.id}')">✕</button></td></tr>`}).join('')||'<tr><td class="em" colspan=6>Sin check lists.</td></tr>'}</table></div>`}
function saveChk(e){e.preventDefault();const f=fd(e.target),d=Object.fromEntries(f);d.r=CHK.map((_,i)=>f.get('c'+i));CHK.forEach((_,i)=>delete d['c'+i]);db.chk.push({id:uid(),...d});save();view=null;draw()}
/* REPORTES */
let rp=null;
function rng(k){let a=new Date();if(k=='s')a.setDate(a.getDate()-(a.getDay()+6)%7);if(k=='m')a.setDate(1);rp={a:loc(a),b:hoy()};draw()}
function setRp(e){rp={a:$('#ra').value,b:$('#rb').value};draw()}
function kdx(){const{a,b}=rp;return db.items.map(i=>{const m=db.mov.filter(x=>x.i==i.id);const ini=m.filter(x=>x.f<a).reduce((s,x)=>s+(x.t=='Entrada'?1:-1)*x.q,0);const ent=m.filter(x=>x.f>=a&&x.f<=b&&x.t=='Entrada').reduce((s,x)=>s+x.q,0),sal=m.filter(x=>x.f>=a&&x.f<=b&&x.t=='Salida').reduce((s,x)=>s+x.q,0);return{n:i.n,u:i.u,ini,ent,sal,fin:ini+ent-sal,min:i.min}})}
function vRep(){if(!rp)rp={a:hoy(),b:hoy()};const{a,b}=rp,inr=f=>f>=a&&f<=b;
const A=db.ats.filter(x=>inr(x.fecha)),C=db.chk.filter(x=>inr(x.f)),F=db.falt.filter(x=>inr(x.f)),K=kdx();
const mx=x=>Math.max(0,...(x.t||[]).map(t=>t.s*t.p)),lv=[0,0,0];A.forEach(x=>lv[nivel(mx(x))]++);
const dias={};A.forEach(x=>dias[x.fecha]=(dias[x.fecha]||0)+1);const mxd=Math.max(1,...Object.values(dias));
const pend=db.falt.filter(x=>!x.ok),malos=C.filter(c=>c.r.includes('N'));
const kp=(n,l,c)=>`<div style="flex:1;min-width:120px;border-left:5px solid ${c||'var(--ac)'};padding:4px 10px"><div style="font-size:26px;font-weight:700">${n}</div><div style="font-size:12px;color:var(--mu)">${l}</div></div>`;
return `<div class="pn np"><h2>Reportes y estadísticas</h2><div class="g"><div><label>Desde</label><input type="date" id="ra" value="${a}" onchange="setRp()"></div><div><label>Hasta</label><input type="date" id="rb" value="${b}" onchange="setRp()"></div></div>
<div class="row"><button class="s" onclick="rng('d')">Hoy</button><button class="s" onclick="rng('s')">Esta semana</button><button class="s" onclick="rng('m')">Este mes</button><button class="b a" onclick="window.print()">Imprimir / PDF</button><button class="b" onclick="csv()">Descargar Excel (CSV)</button></div></div>
<div class="pn"><h3>Resumen del ${a} al ${b}</h3><div class="row">${kp(A.length,'ATS realizados')}${kp(lv[2],'ATS con riesgo alto','var(--al)')}${kp(C.length,'Check lists')}${kp(malos.length,'Equipos con observación','var(--al)')}${kp(F.length,'EPP faltantes reportados')}${kp(pend.length,'EPP pendientes de entrega (total)','var(--md)')}</div></div>
<div class="pn"><h3>ATS por día</h3>${Object.keys(dias).sort().map(d=>`<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><span style="width:80px;font-size:12px">${d}</span><div style="background:var(--ac);height:14px;width:${dias[d]/mxd*70}%"></div><b>${dias[d]}</b></div>`).join('')||'<p class="em">Sin ATS en este periodo.</p>'}
<p style="font-size:13px">Riesgo máximo por ATS: <span class="tag R0">Bajo ${lv[0]}</span> <span class="tag R1">Medio ${lv[1]}</span> <span class="tag R2">Alto ${lv[2]}</span></p></div>
<div class="pn"><h3>Kardex del periodo (inventario actualizado)</h3><table><tr><th>Insumo</th><th>Unid.</th><th>Saldo inicial</th><th>Entradas</th><th>Salidas</th><th>Saldo final</th></tr>${K.map(k=>`<tr><td>${esc(k.n)}</td><td>${esc(k.u)}</td><td>${k.ini}</td><td>${k.ent}</td><td>${k.sal}</td><td><b class="${k.fin<=k.min?'warn':''}">${k.fin}</b></td></tr>`).join('')||'<tr><td class="em" colspan=6>Sin insumos.</td></tr>'}</table></div>
<div class="pn"><h3>EPP pendientes de entrega</h3><table><tr><th>Integrante</th><th>Material</th><th>Cant.</th><th>Reportado</th></tr>${pend.map(f=>`<tr><td>${esc(pn(f.p))}</td><td>${esc(f.m)}</td><td>${esc(f.c)}</td><td>${f.f}</td></tr>`).join('')||'<tr><td class="em" colspan=4>Todo entregado.</td></tr>'}</table></div>
<div class="pn"><h3>Check lists con observación</h3><table><tr><th>Fecha</th><th>Equipo</th><th>Placa</th><th>Operador</th><th>No cumple</th></tr>${malos.map(c=>`<tr><td>${c.f}</td><td>${esc(c.eq)}</td><td>${esc(c.pl)}</td><td>${esc(pn(c.op))}</td><td>${c.r.filter(x=>x=='N').length}</td></tr>`).join('')||'<tr><td class="em" colspan=5>Sin observaciones.</td></tr>'}</table></div>`}
function csv(){const{a,b}=rp,L=[['Insumo','Unidad','Saldo inicial','Entradas','Salidas','Saldo final'],...kdx().map(k=>[k.n,k.u,k.ini,k.ent,k.sal,k.fin]),[],['Fecha','Insumo','Tipo','Cantidad','Persona','Nota'],...db.mov.filter(m=>m.f>=a&&m.f<=b).map(m=>[m.f,(db.items.find(i=>i.id==m.i)||{}).n,m.t,m.q,m.p?pn(m.p):'',m.nt||''])];
const t='\ufeff'+L.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n'),x=document.createElement('a');x.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));x.download=`kardex-${a}_${b}.csv`;x.click()}
/* RESPALDO */
function vResp(){return `<div class="pn"><h2>Respaldo de datos</h2><p>Los datos se guardan en este dispositivo. Descarga un respaldo con frecuencia y compártelo por WhatsApp o correo para tener copia o pasarlo a otro equipo.</p>
<div class="row"><button class="b a" onclick="exp()">Descargar respaldo (.json)</button><label class="s" style="color:var(--tx)">Importar respaldo<input type="file" accept=".json" hidden onchange="imp(this)"></label></div></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='sst-respaldo-'+hoy()+'.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{db=Object.assign(db,JSON.parse(r.result));save();alert('Respaldo importado');go('pers')}catch{alert('Archivo no válido')}};r.readAsText(i.files[0])}
draw();
</script></body></html>
